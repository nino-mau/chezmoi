colourful: true

filekinds:
  normal: { foreground: "{{colors.on_surface.default.hex}}" }
  directory: { foreground: "{{colors.primary.default.hex}}" }
  symlink: { foreground: "{{colors.terminal_normal_blue.default.hex}}" }
  pipe: { foreground: "{{colors.terminal_normal_white.default.hex}}" }
  block_device:
    { foreground: "{{colors.terminal_bright_red.default.hex | lighten 10}}" }
  char_device:
    { foreground: "{{colors.terminal_bright_red.default.hex | lighten 10}}" }
  socket: { foreground: "{{colors.terminal_normal_white.default.hex}}" }
  special: { foreground: "{{colors.tertiary.default.hex}}" }
  executable: { foreground: "{{colors.terminal_normal_green.default.hex}}" }
  mount_point: { foreground: "{{colors.teal.default.hex}}" }

perms:
  user_read:
    { foreground: "{{colors.terminal_normal_red.default.hex}}", is_bold: true }
  user_write:
    {
      foreground: "{{colors.terminal_normal_yellow.default.hex}}",
      is_bold: true,
    }
  user_execute_file:
    {
      foreground: "{{colors.terminal_normal_green.default.hex}}",
      is_bold: true,
    }
  user_execute_other:
    {
      foreground: "{{colors.terminal_normal_green.default.hex}}",
      is_bold: true,
    }
  group_read: { foreground: "{{colors.terminal_normal_red.default.hex}}" }
  group_write: { foreground: "{{colors.terminal_normal_yellow.default.hex}}" }
  group_execute: { foreground: "{{colors.terminal_normal_green.default.hex}}" }
  other_read: { foreground: "{{colors.terminal_normal_red.default.hex}}" }
  other_write: { foreground: "{{colors.terminal_normal_yellow.default.hex}}" }
  other_execute: { foreground: "{{colors.terminal_normal_green.default.hex}}" }
  special_user_file: { foreground: "{{colors.tertiary.default.hex}}" }
  special_other: { foreground: "{{colors.terminal_bright_black.default.hex}}" }
  attribute: { foreground: "{{colors.terminal_bright_black.default.hex}}" }

size:
  major: { foreground: "{{colors.terminal_bright_white.default.hex}}" }
  minor: { foreground: "{{colors.terminal_bright_cyan.default.hex}}" }
  number_byte: { foreground: "{{colors.terminal_normal_white.default.hex}}" }
  number_kilo: { foreground: "{{colors.terminal_bright_white.default.hex}}" }
  number_mega: { foreground: "{{colors.terminal_normal_blue.default.hex}}" }
  number_giga: { foreground: "{{colors.tertiary.default.hex}}" }
  number_huge: { foreground: "{{colors.tertiary.default.hex}}" }
  unit_byte: { foreground: "{{colors.terminal_bright_white.default.hex}}" }
  unit_kilo: { foreground: "{{colors.terminal_bright_cyan.default.hex}}" }
  unit_mega: { foreground: "{{colors.tertiary.default.hex}}" }
  unit_giga: { foreground: "{{colors.tertiary.default.hex}}" }
  unit_huge: { foreground: "{{colors.teal.default.hex}}" }

users:
  user_you: { foreground: "{{colors.on_surface.default.hex}}" }
  user_root: { foreground: "{{colors.terminal_normal_red.default.hex}}" }
  user_other:
    { foreground: "{{colors.terminal_bright_red.default.hex | lighten 10}}" }
  group_yours: { foreground: "{{colors.terminal_bright_white.default.hex}}" }
  group_other: { foreground: "{{colors.terminal_bright_black.default.hex}}" }
  group_root: { foreground: "{{colors.terminal_normal_red.default.hex}}" }

links:
  normal: { foreground: "{{colors.terminal_normal_blue.default.hex}}" }
  multi_link_file: { foreground: "{{colors.terminal_normal_blue.default.hex}}" }

git:
  new: { foreground: "{{colors.terminal_normal_green.default.hex}}" }
  modified: { foreground: "{{colors.terminal_normal_yellow.default.hex}}" }
  deleted:
    { foreground: "{{colors.terminal_bright_red.default.hex | lighten 10}}" }
  renamed: { foreground: "{{colors.teal.default.hex}}" }
  typechange: { foreground: "{{colors.terminal_normal_magenta.default.hex}}" }
  ignored: { foreground: "{{colors.terminal_bright_black.default.hex}}" }
  conflicted: { foreground: "{{colors.terminal_bright_yellow.default.hex}}" }

git_repo:
  branch_main: { foreground: "{{colors.terminal_bright_white.default.hex}}" }
  branch_other: { foreground: "{{colors.tertiary.default.hex}}" }
  git_clean: { foreground: "{{colors.terminal_normal_green.default.hex}}" }
  git_dirty:
    { foreground: "{{colors.terminal_bright_red.default.hex | lighten 10}}" }

security_context:
  colon: { foreground: "{{colors.outline.default.hex}}" }
  user: { foreground: "{{colors.terminal_bright_black.default.hex}}" }
  role: { foreground: "{{colors.tertiary.default.hex}}" }
  typ: { foreground: "{{colors.terminal_bright_black.default.hex}}" }
  range: { foreground: "{{colors.tertiary.default.hex}}" }

file_type:
  image: { foreground: "{{colors.terminal_normal_yellow.default.hex}}" }
  video: { foreground: "{{colors.terminal_normal_red.default.hex}}" }
  music: { foreground: "{{colors.terminal_normal_green.default.hex}}" }
  lossless: { foreground: "{{colors.teal.default.hex}}" }
  crypto: { foreground: "{{colors.terminal_bright_black.default.hex}}" }
  document: { foreground: "{{colors.on_surface.default.hex}}" }
  compressed: { foreground: "{{colors.terminal_normal_magenta.default.hex}}" }
  temp:
    { foreground: "{{colors.terminal_bright_red.default.hex | lighten 10}}" }
  compiled: { foreground: "{{colors.terminal_bright_blue.default.hex}}" }
  source: { foreground: "{{colors.terminal_normal_blue.default.hex}}" }

punctuation: { foreground: "{{colors.outline.default.hex}}" }
date: { foreground: "{{colors.terminal_normal_yellow.default.hex}}" }
inode: { foreground: "{{colors.terminal_bright_white.default.hex}}" }
blocks: { foreground: "{{colors.outline.default.hex}}" }
header: { foreground: "{{colors.on_surface.default.hex}}" }
octal: { foreground: "{{colors.teal.default.hex}}" }
flags: { foreground: "{{colors.tertiary.default.hex}}" }

symlink_path: { foreground: "{{colors.terminal_bright_cyan.default.hex}}" }
control_char: { foreground: "{{colors.terminal_bright_blue.default.hex}}" }
broken_symlink: { foreground: "{{colors.terminal_normal_red.default.hex}}" }
broken_path_overlay:
  { foreground: "{{colors.terminal_bright_black.default.hex}}" }
