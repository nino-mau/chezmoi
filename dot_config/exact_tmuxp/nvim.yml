session_name: nvim
start_directory: $HOME/.config/nvim
windows:
  - window_name: editor
    panes:
      - shell_command:
          - nvim

  - window_name: cmd
    panes:
      - shell_command:
          - clear

  - window_name: cmd
    panes:
      - shell_command:
          - clear

  - window_name: ai
    panes:
      - pi --continue
