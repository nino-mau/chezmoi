colourful: true

filekinds:
  normal: { foreground: "#cdd6f4" }
  directory: { foreground: "#89b4fa" }
  symlink: { foreground: "#89b4fa" }
  pipe: { foreground: "#bac2de" }
  block_device:
    { foreground: "#f8b9cb" }
  char_device:
    { foreground: "#f8b9cb" }
  socket: { foreground: "#bac2de" }
  special: { foreground: "#cba6f7" }
  executable: { foreground: "#a6e3a1" }
  mount_point: { foreground: "#85d4d7" }

perms:
  user_read:
    { foreground: "#f38ba8", is_bold: true }
  user_write:
    {
      foreground: "#f9e2af",
      is_bold: true,
    }
  user_execute_file:
    {
      foreground: "#a6e3a1",
      is_bold: true,
    }
  user_execute_other:
    {
      foreground: "#a6e3a1",
      is_bold: true,
    }
  group_read: { foreground: "#f38ba8" }
